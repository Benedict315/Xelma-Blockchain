[package]
name = "xelma-replay"
version = "0.1.0"
edition = "2021"
description = "Deterministic round replay engine for Xelma audits and disputes"
license = "MIT"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "xelma-replay"
path = "src/bin/replay.rs"
